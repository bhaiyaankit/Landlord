<style>
/* Layout: sidebar of work areas + a working canvas; country filter and FX live in the top bar. */
:root{
  --surface:#f3f6f4; --raised:#ffffff; --sunken:#e8eeea;
  --ink:#17201c; --ink-muted:#55625b; --line:#d9e1dc;

  --accent:#c8691c; --accent-ink:#8f4a0f; --accent-soft:#f8e6d3;
  --ok:#22704a; --ok-soft:#dff0e6; --warn:#8a5a00; --warn-soft:#fbeec8;
  --bad:#b42318; --bad-soft:#fde4e1; --info:#2c5d8f; --info-soft:#e1ecf7;
  --font-display:"Sora",system-ui,sans-serif; --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius-sm:4px; --radius-md:8px; --radius-lg:14px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --shadow:0 1px 2px rgba(23,32,28,.06),0 4px 16px rgba(23,32,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#111614; --raised:#1a201d; --sunken:#0c100e; --ink:#eaf0ec; --ink-muted:#a2aea7; --line:#2b3530;
  --brand:#6fc3a4; --brand-ink:#0c1a14; --brand-soft:#1c3a30; --accent:#f0a35e; --accent-ink:#f5b97f; --accent-soft:#3d2a1a;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#e3b341; --warn-soft:#3a2f12; --bad:#ff8a7a; --bad-soft:#3d1c18; --info:#8ab8e8; --info-soft:#18283a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#111614; --raised:#1a201d; --sunken:#0c100e; --ink:#eaf0ec; --ink-muted:#a2aea7; --line:#2b3530;
  --brand:#6fc3a4; --brand-ink:#0c1a14; --brand-soft:#1c3a30; --accent:#f0a35e; --accent-ink:#f5b97f; --accent-soft:#3d2a1a;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#e3b341; --warn-soft:#3a2f12; --bad:#ff8a7a; --bad-soft:#3d1c18; --info:#8ab8e8; --info-soft:#18283a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:24px;font-weight:600} h2{font-size:17px;font-weight:600} h3{font-size:14px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)} .small{font-size:12px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--raised);border-right:1px solid var(--line);padding:var(--space-4) var(--space-3);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:var(--space-4)}
.logo{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2)}
.logo svg{flex:none}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--radius-md);color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken)}
.nav a.on{background:var(--brand-soft);color:var(--ink)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);padding:var(--space-3) 10px var(--space-1)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:var(--space-3);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}

.seg{display:inline-flex;background:var(--sunken);border-radius:var(--radius-md);padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink-muted)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.content{padding-block:var(--space-6) 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--space-6);max-width:1240px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--ink-muted);max-width:68ch}
.btn{border:1px solid var(--line);background:var(--raised);padding:7px 12px;border-radius:var(--radius-md);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);min-width:0}
.panel>h2{margin-bottom:var(--space-3)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap}
.grid{display:grid;gap:var(--space-4)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:var(--space-3)}
.kpi{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted)}
.kpi .v{font-family:var(--font-display);font-size:20px;line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.tw{overflow-x:auto;margin:0 calc(-1 * var(--space-4));padding:0 var(--space-4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunken)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--sunken);color:var(--ink-muted)} .p-brand{background:var(--brand-soft);color:var(--ink)}
.flag{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:500;border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 4px;color:var(--ink-muted);vertical-align:1px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:var(--space-3);justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:500} .item>div:first-child{min-width:0}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:var(--space-3);overflow-x:auto;padding-bottom:var(--space-2)}
.col{background:var(--sunken);border-radius:var(--radius-lg);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);min-height:160px}
.col h3{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-family:var(--font-sans)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--brand)}
.bar{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.card .bar{background:var(--line)}
.check{display:flex;flex-direction:column}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.check .hint{display:block;font-size:12px;color:var(--ink-muted)}
.check input:checked + span{color:var(--ink-muted)}
.note{background:var(--info-soft);border-radius:var(--radius-md);padding:var(--space-3);font-size:13px}
.note.warn{background:var(--warn-soft)}
.note b{font-weight:600}
.chart{display:flex;flex-direction:column;gap:10px}
.chart .r{display:grid;grid-template-columns:140px 1fr 110px;gap:var(--space-3);align-items:center;font-size:13px}
.chart .track{height:14px;background:var(--sunken);border-radius:var(--radius-sm);position:relative;overflow:hidden}
.chart .inc{position:absolute;inset:0 auto 0 0;background:var(--brand)}
.chart .exp{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85;height:50%;top:50%}
.legend{display:flex;gap:var(--space-4);font-size:12px;color:var(--ink-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--ink-muted);padding:var(--space-4) 0;text-align:center}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(640px,100%);height:100%;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--space-4);box-shadow:var(--shadow)}
.drawer>*,.modal>*{flex-shrink:0}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--raised);border-radius:var(--radius-lg);width:min(520px,100%);max-height:92vh;overflow:auto;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--ink-muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);padding:8px 10px;font-size:14px;color:var(--ink);width:100%}
.form textarea{min-height:80px;resize:vertical}
pre.msg{white-space:pre-wrap;background:var(--sunken);border-radius:var(--radius-md);padding:var(--space-3);font-family:var(--font-sans);font-size:13px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--ink-muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.dl dt{color:var(--ink-muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--radius-md);z-index:40;font-weight:500}
.demo-flag{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--radius-sm);padding:2px 8px;font-weight:500}
.portal-hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.portal-hero .v{font-family:var(--font-display);font-size:30px;font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav .sec{display:none}
  .nav a{white-space:nowrap}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .chart .r{grid-template-columns:96px 1fr 84px}
  .form{grid-template-columns:1fr}
  .dl{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const T=iso(TODAY);
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const ym=s=>s.slice(0,7);
const monthName=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short",year:"numeric"})};
const fdate=s=>s?parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—";
const CUR={UK:"GBP",IN:"INR"};
const money=(n,c)=>{n=Math.round((n||0)*100)/100;const neg=n<0;n=Math.abs(n);
  const s=c==="IN"||c==="INR"?"₹"+n.toLocaleString("en-IN",{maximumFractionDigits:0}):"£"+n.toLocaleString("en-GB",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});return (neg?"−":"")+s};

/* ---------- country rules ---------- */
const ONBOARD={
 UK:[
  ["id","Identity and Right to Rent check","Check original ID for every adult occupant and keep a dated copy."],
  ["ref","Referencing","Employer, previous landlord and credit check."],
  ["afford","Affordability and guarantor","Rent is usually expected to be under about a third of income; take a guarantor if not."],
  ["holding","Holding deposit","Capped at 1 week's rent under the Tenant Fees Act."],
  ["agreement","Tenancy agreement signed","England: assured periodic tenancy with a written statement of terms (Renters' Rights Act)."],
  ["deposit","Tenancy deposit received","Capped at 5 weeks' rent where annual rent is under £50,000."],
  ["protect","Deposit protected (DPS, TDS or mydeposits)","Within 30 days of receipt, with prescribed information served."],
  ["docs","Gas Safety, EPC and EICR copies given","Give copies before move-in and keep proof of service."],
  ["alarms","Smoke and CO alarms tested on day one",""],
  ["inventory","Inventory and check-in report signed","Dated photos of every room, signed by the tenant."],
  ["meters","Meter readings, council tax and utilities notified",""],
  ["so","Standing order set up","Rent due date matches the agreement."],
  ["keys","Keys handed over","Record how many sets were given."]],
 IN:[
  ["kyc","KYC: Aadhaar and PAN copies","For every adult occupant."],
  ["employer","Employer or college ID and references",""],
  ["police","Police verification submitted","Mandatory in most cities; many accept it online."],
  ["agreement","Rent agreement drafted","Usually 11 months. Longer terms must be registered."],
  ["stamp","Stamp duty paid and agreement registered","Use e-registration where the state offers it."],
  ["deposit","Security deposit received","Check state rules. The Model Tenancy Act caps it at 2 months for homes."],
  ["noc","Society or RWA move-in form and NOC",""],
  ["inventory","Inventory of fixtures and furniture signed","Fans, lights, ACs, geyser, appliances and their condition."],
  ["meters","Electricity and water meter readings",""],
  ["maint","Society maintenance charges agreed","Say in the agreement who pays."],
  ["mandate","Rent mandate set up (UPI AutoPay or NEFT)",""],
  ["pan","Landlord PAN shared with tenant","The tenant needs it for HRA claims and TDS when rent is over ₹50,000 a month."],
  ["keys","Keys and access cards handed over",""]]
};
const MOVEOUT={
 UK:[
  ["notice","Notice received and checked","Tenant: at least 2 months under the Renters' Rights Act periodic regime."],
  ["inspect","Check-out inspection against the inventory","Allow for fair wear and tear."],
  ["photos","Dated check-out photos taken",""],
  ["meters","Final meter readings, council tax and utilities notified",""],
  ["keys","All keys returned",""],
  ["deduct","Deductions proposed with evidence","Send to the tenant before raising them with the scheme."],
  ["refund","Deposit returned through the scheme","Within 10 days of agreeing the amounts."],
  ["address","Forwarding address recorded",""],
  ["relet","Re-letting started",""]],
 IN:[
  ["notice","Notice received under the agreement","Usually 1 to 2 months."],
  ["inspect","Joint inspection against the inventory",""],
  ["dues","Pending rent, electricity and society dues cleared",""],
  ["noc","Society move-out NOC",""],
  ["paint","Painting and cleaning deductions agreed","Only if the agreement provides for them."],
  ["keys","Keys and access cards returned",""],
  ["refund","Deposit refunded by NEFT or UPI","Keep the transaction reference."],
  ["records","Police and society records updated",""],
  ["relet","Re-letting started",""]]
};
const COMPLIANCE_TYPES={UK:["Gas Safety certificate (CP12)","EICR electrical report","EPC","Landlord insurance","Deposit protection","HMO or selective licence","Smoke and CO alarm check"],IN:["Rent agreement renewal","Property tax","Police verification","Society maintenance","Home insurance","Fire safety NOC"]};
const STAGES=[["lead","Enquiry"],["application","Application"],["verification","Checks"],["agreement","Agreement and deposit"],["movein","Ready to move in"],["active","Active"],["notice","On notice"],["ended","Ended"]];
const stageName=s=>(STAGES.find(x=>x[0]===s)||[,s])[1];
const MAINT_STATUS=["Reported","Assigned","In progress","Waiting on tenant","Resolved"];
const PRIORITY={Emergency:"p-bad",High:"p-warn",Normal:"p-info",Low:"p-mute"};
const PRIORITY_SLA={Emergency:1,High:3,Normal:14,Low:28};
const METHODS={UK:["Bank transfer","Standing order","Card","Cash"],IN:["UPI","NEFT / IMPS","Cheque","Cash"]};

/* ---------- seed ---------- */
function seed(){
  const m=n=>addMonths(T,n);
  const props=[
   {id:"p1",name:"Camden 2-bed flat",country:"UK",city:"London",address:"Flat 3, 18 Arlington Road, NW1",beds:2,rent:2350,status:"Let"},
   {id:"p2",name:"Didsbury terrace",country:"UK",city:"Manchester",address:"42 Wilmslow Road, M20",beds:3,rent:1450,status:"Let"},
   {id:"p3",name:"Clifton studio",country:"UK",city:"Bristol",address:"7b Royal York Crescent, BS8",beds:1,rent:1050,status:"Vacant"},
   {id:"p4",name:"Koramangala 3BHK",country:"IN",city:"Bengaluru",address:"A-604, Prestige Tower, 5th Block",beds:3,rent:62000,status:"Let"},

function ensureCharges(S){
  const cur=ym(T);
  S.tenants.forEach(t=>{
    if(!["active","notice","ended"].includes(t.stage)||!t.start)return;
    let k=ym(t.start);const stop=t.stage==="ended"&&t.end?ym(t.end):cur;
    while(k<=stop&&k<=cur){
      const id=t.id+"-"+k;
      if(!S.charges.some(c=>c.id===id)){
        const due=k+"-"+pad(Math.min(t.dueDay,28));
        S.charges.push({id,tenantId:t.id,period:k,type:"Rent",amount:t.rent,due});
      }
      k=ym(addMonths(k+"-01",1));
    }
  });
  S.charges.sort((a,b)=>a.due<b.due?-1:1);
}

function ledger(tid){
  // allocate payments to oldest charges first
  const ch=S.charges.filter(c=>c.tenantId===tid).map(c=>({...c,paid:0}));
  let pot=S.payments.filter(p=>p.tenantId===tid).reduce((a,p)=>a+p.amount,0);
  ch.forEach(c=>{const x=Math.min(pot,c.amount);c.paid=x;pot-=x});
  ch.forEach(c=>{c.bal=c.amount-c.paid;c.late=c.bal>0&&c.due<T?daysBetween(c.due,T):0;
    c.state=c.bal<=0?"Paid":c.due>=T?"Due":c.paid>0?"Part paid":"Overdue"});
  return {charges:ch,credit:pot};
}
function balance(tid){const l=ledger(tid);return l.charges.reduce((a,c)=>a+c.bal,0)-l.credit}
function arrears(tid){return ledger(tid).charges.filter(c=>c.late>0).reduce((a,c)=>a+c.bal,0)}
function oldestLate(tid){const c=ledger(tid).charges.find(c=>c.late>0);return c?c.late:0}
function compState(c){const d=daysBetween(T,c.expires);return d<0?["Expired","p-bad",d]:d<=30?["Due soon","p-warn",d]:d<=60?["Upcoming","p-info",d]:["Valid","p-ok",d]}

V.reports=()=>{
  const from=addMonths(T,-12);
  const rows=scopedProps().map(p=>{const tids=S.tenants.filter(t=>t.propertyId===p.id).map(t=>t.id);
    const inc=S.payments.filter(x=>tids.includes(x.tenantId)&&x.date>=from).reduce((a,x)=>a+x.amount,0);
    const exp=S.expenses.filter(e=>e.propertyId===p.id&&e.date>=from).reduce((a,e)=>a+e.amount,0)+S.maint.filter(m=>m.propertyId===p.id&&m.reported>=from).reduce((a,m)=>a+(m.cost||0),0);
    return {p,inc,exp,gbp:x=>p.country==="UK"?x:x/S.fx}});
  const max=Math.max(1,...rows.map(r=>r.gbp(r.inc)));
  const tot=rows.reduce((a,r)=>({inc:a.inc+r.gbp(r.inc),exp:a.exp+r.gbp(r.exp)}),{inc:0,exp:0});
  return head("Reports","Last 12 months of rent received against costs, per property. Combined totals use your exchange rate of ₹"+S.fx+" to £1, set in Setup.",`<button class="btn" data-a="csv">Copy as CSV</button>`)+
  `<div class="kpis"><div class="kpi"><div class="l">Rent received, 12 months</div><div class="v">${money(tot.inc,"UK")}</div><div class="s">≈ ${money(tot.inc*S.fx,"IN")}</div></div>
   <div class="kpi"><div class="l">Costs</div><div class="v">${money(tot.exp,"UK")}</div><div class="s">≈ ${money(tot.exp*S.fx,"IN")}</div></div>
   <div class="kpi"><div class="l">Net before tax</div><div class="v">${money(tot.inc-tot.exp,"UK")}</div><div class="s">≈ ${money((tot.inc-tot.exp)*S.fx,"IN")}</div></div></div>
  <section class="panel"><div class="ph"><h2>Income and costs by property</h2><div class="legend"><span><i style="background:var(--brand)"></i>Rent received</span><span><i style="background:var(--accent)"></i>Costs</span></div></div>
   <div class="chart">${rows.map(r=>`<div class="r"><span>${esc(r.p.name)}</span><div class="track"><span class="inc" style="width:${r.gbp(r.inc)/max*100}%"></span><span class="exp" style="width:${r.gbp(r.exp)/max*100}%"></span></div><span class="num r" style="text-align:right">${money(r.inc-r.exp,r.p.country)}</span></div>`).join("")}</div></section>
  <div class="grid g2"><section class="panel"><h2>UK tax notes ${flag("UK")}</h2><p class="small muted">Rental profit goes on your Self Assessment return (property pages). Mortgage interest is not deducted from profit; it earns a 20% tax credit instead. Making Tax Digital for Income Tax applies to landlords with qualifying income over £50,000 from April 2026, so keep digital records each quarter.</p></section>
  <section class="panel"><h2>India tax notes ${flag("IN")}</h2><p class="small muted">Rent is taxed as “Income from house property”. Municipal taxes paid are deducted from the annual value, then a flat 30% standard deduction applies, plus home-loan interest under section 24(b). If you live in the UK, Indian rent is also reported on your UK return, with credit for Indian tax under the double tax treaty, and tenants must deduct TDS on rent paid to a non-resident.</p></section></div>
  <p class="small muted">These notes are general guidance, not tax advice. Check with an accountant for your situation.</p>`;
};

function tenantDrawer(id,tab){
  const t=ten(id);const c=ctry(t);const p=prop(t.propertyId);tab=tab||(["lead","application","verification","agreement","movein"].includes(t.stage)?"onboard":t.stage==="notice"||t.stage==="ended"?"moveout":"ledger");
  const tabs=[["onboard","Onboarding"],["ledger","Rent ledger"],["moveout","Move-out"],["history","Repairs and issues"],["details","Details"]];
  const L=ledger(t.id);
  const nextStage={lead:"application",application:"verification",verification:"agreement",agreement:"movein",movein:"active"}[t.stage];
  let body="";
  if(tab==="onboard"){const items=ONBOARD[c];const done=items.filter(x=>t.onboard[x[0]]).length;
    body=`<div class="bar"><i style="width:${done/items.length*100}%"></i></div><p class="small muted">${done} of ${items.length} done · ${c==="UK"?"England rules":"India rules"}</p>
    <div class="check">${items.map(([k,l,h])=>`<label><input type="checkbox" data-ck="onboard" data-k="${k}" ${t.onboard[k]?"checked":""}><span>${esc(l)}${h?`<span class="hint">${esc(h)}</span>`:""}</span></label>`).join("")}</div>
    ${nextStage?`<div class="row">${nextStage==="active"&&done<items.length?`<div class="note warn small">${items.length-done} checks are still open. You can move them in anyway, but record why.</div>`:""}<button class="btn primary" data-a="advance" data-id="${t.id}">${nextStage==="active"?"Mark moved in":"Move to "+stageName(nextStage)}</button>${t.stage!=="lead"?"":""}<button class="btn danger" data-a="withdraw" data-id="${t.id}">Withdrawn</button></div>`:""}`}
  if(tab==="ledger"){const b=balance(t.id);
    body=`<div class="row"><b>Balance: <span class="num" style="color:${arrears(t.id)>0?"var(--bad)":"inherit"}">${b>0?money(b,c)+" owed":b<0?money(-b,c)+" in credit":"Paid up"}</span></b><span class="grow"></span><button class="btn sm" data-a="remind" data-id="${t.id}">Reminder</button><button class="btn sm" data-a="charge" data-id="${t.id}">Add charge</button><button class="btn sm primary" data-a="pay" data-id="${t.id}">Record payment</button></div>
    <div class="tw"><table><thead><tr><th>Month</th><th>Due</th><th class="r">Amount</th><th class="r">Paid</th><th>Status</th><th></th></tr></thead><tbody>${L.charges.slice().reverse().map(x=>`<tr><td>${monthName(x.period)}<div class="small muted">${esc(x.type)}</div></td><td>${fdate(x.due)}</td><td class="r num">${money(x.amount,c)}</td><td class="r num">${money(x.paid,c)}</td><td>${pill(x.state,stateCls[x.state])}</td><td>${x.bal<=0?`<button class="btn sm" data-a="receipt" data-id="${x.id}">Receipt</button>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No charges yet. Rent starts once the tenant moves in.</td></tr>`}</tbody></table></div>`}
  if(tab==="moveout"){
    if(!["notice","ended"].includes(t.stage)){body=`<div class="empty">Not on notice.</div><div class="row">${t.stage==="active"?`<button class="btn" data-a="notice-new" data-id="${t.id}">Record notice</button>`:""}</div>`}
    else{const items=MOVEOUT[c];const ded=(t.deductions||[]).reduce((a,d)=>a+d.amount,0);const arr=Math.max(0,balance(t.id));
    body=`<dl class="dl"><dt>Notice received</dt><dd>${fdate(t.noticeDate)}</dd><dt>Leaving</dt><dd>${fdate(t.end)}</dd><dt>Deposit</dt><dd>${money(t.deposit,c)} · ${esc(t.depositRef||"")}</dd></dl>
    <div class="check">${items.map(([k,l,h])=>`<label><input type="checkbox" data-ck="moveout" data-k="${k}" ${t.moveout[k]?"checked":""}><span>${esc(l)}${h?`<span class="hint">${esc(h)}</span>`:""}</span></label>`).join("")}</div>
    <h3>Deductions</h3><div class="list">${(t.deductions||[]).map((d,i)=>`<div class="item"><span>${esc(d.reason)}</span><div class="row"><span class="num">${money(d.amount,c)}</span><button class="btn sm danger" data-a="ded-del" data-id="${t.id}" data-i="${i}">Remove</button></div></div>`).join("")||`<div class="small muted">None</div>`}</div>
    <form class="form" id="dedForm"><label for="ded-r">Reason<input id="ded-r" required placeholder="Broken blind, bedroom 2"></label><label for="ded-a">Amount<input id="ded-a" type="number" min="0" required></label><div class="full"><button class="btn sm" type="submit">Add deduction</button></div></form>
    <div class="note"><b>Deposit return:</b> ${money(t.deposit,c)} held − ${money(ded,c)} deductions − ${money(arr,c)} unpaid rent = <b>${money(Math.max(0,t.deposit-ded-arr),c)}</b> to return.${t.deposit-ded-arr<0?` The tenant still owes ${money(ded+arr-t.deposit,c)}.`:""}</div>
    ${t.stage==="notice"?`<div class="row" id="closeRow"><button class="btn primary" data-a="close" data-id="${t.id}">Close tenancy</button></div>`:pill("Tenancy closed","p-mute")}`}}
  if(tab==="history"){const ms=S.maint.filter(m=>m.tenantId===t.id);const is=S.issues.filter(i=>i.tenantId===t.id);

function field(f){const id="f-"+f.k;const v=f.v==null?"":f.v;const cls=f.full?"full":"";
  if(f.t==="select")return `<label class="${cls}" for="${id}">${f.l}<select id="${id}" name="${f.k}">${f.o.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?"selected":""}>${esc(lab)}</option>`}).join("")}</select></label>`;
  if(f.t==="textarea")return `<label class="full" for="${id}">${f.l}<textarea id="${id}" name="${f.k}">${esc(v)}</textarea></label>`;
  return `<label class="${cls}" for="${id}">${f.l}<input id="${id}" name="${f.k}" type="${f.t||"text"}" value="${esc(v)}" ${f.req?"required":""} ${f.t==="number"?'step="any" min="0"':""}></label>`}

  S.expenses.forEach(e=>{const pr=prop(e.propertyId);lines.push([e.date,e.category,pr.name,pr.country,e.note,-e.amount,CUR[pr.country]].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","))});
  openModal(`<h2>Transactions as CSV</h2><p class="small muted">Copy and paste into Excel or Google Sheets, or give it to your accountant.</p><pre class="msg" id="msgText" style="max-height:300px;overflow:auto;font-family:var(--font-mono);font-size:11px">${esc(lines.join("\n"))}</pre><div class="row"><button class="btn primary" data-a="copy">Copy CSV</button><button class="btn" data-a="close-layer">Close</button></div>`)};
A.reset=()=>{$("#resetRow").innerHTML=`<span class="small">This replaces everything with fresh sample data.</span><button class="btn danger" data-a="reset-yes">Yes, reset</button><button class="btn" data-a="reset-no">Cancel</button>`};
A["reset-yes"]=()=>{S=seed();save("Sample data reset")};
A["reset-no"]=()=>render();

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.matches("[data-scrim]")){closeLayer();return}
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;if(A[a]){if(el.tagName==="A"&&!el.target)e.preventDefault();e.stopPropagation();A[a](el)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer();if(e.key==="Enter"&&e.target.matches(".card[data-a]"))e.target.click()});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ck){const t=ten(layerCtx.tenant);t[el.dataset.ck][el.dataset.k]=el.checked;save();refreshDrawer();return}
  if(el.id==="portalPick"){ui.portal=el.value;render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="modalForm"){const d=Object.fromEntries(new FormData(f).entries());const err=formHandler&&formHandler(d);if(typeof err==="string"){toast(err);return}if(!layerCtx||!layerCtx.tenant)closeLayer();return}
  if(f.id==="portalForm"){const t=ten(ui.portal);S.maint.push({id:uid("m"),propertyId:t.propertyId,tenantId:t.id,title:$("#pf-title").value,category:$("#pf-cat").value,priority:$("#pf-pri").value,status:"Reported",reported:T,contractor:"",cost:0,notes:"From tenant portal: "+$("#pf-notes").value});save("Repair reported by "+t.name);return}
  if(f.id==="dedForm"){const t=ten(layerCtx.tenant);t.deductions=t.deductions||[];t.deductions.push({reason:$("#ded-r").value,amount:+$("#ded-a").value||0});save("Deduction added");refreshDrawer();return}
  if(f.id==="setupForm"){const v=+$("#fx").value;if(v>0){S.fx=v;save("Exchange rate saved")}}
});
$("#country").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.country=b.dataset.c;try{localStorage.setItem(KEY+"-c",ui.country)}catch(x){}render()});

/* ---------- render ---------- */
const RESERVED=VIEWS.map(v=>v[0]).filter(k=>k!=="sec");
function render(){const h=location.hash.slice(1);ui.view=RESERVED.includes(h)?h:"dashboard";renderNav();$("#view").innerHTML=V[ui.view]();if(layerCtx&&layerCtx.tenant){/* keep drawer fresh */const ctx=layerCtx;tenantDrawer(ctx.tenant,ctx.tab)}}
window.addEventListener("hashchange",()=>{closeLayer();render();window.scrollTo(0,0)});
render();
})();
</script>
